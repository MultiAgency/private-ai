# Private Investigator's webhook relay. Deploy: npx wrangler deploy (from relay/),
# after `wrangler secret put WEBHOOK_SECRET`, `wrangler secret put PAYMENT_KEY`,
# and `wrangler secret put STATS_SECRET` (gates GET /stats and /stats.json).
# Optional: `wrangler secret put RECOVERY_SECRET` enables POST /recover with
# x-recovery-key. Body: {installation, repo_id, pr, call_id?}. Resume a paused
# known call, or attach a reconciled call id after an ambiguous submission.
# It verifies the call using PAYMENT_KEY and never resubmits an execution.
name = "private-investigator-relay"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[vars]
OUTLAYER_PROJECT = "hack.near/private-investigator"
# Per call, in OutLayer's micro-USD: $0.05, the relay key's max_per_call (a step costs about $0.01).
COMPUTE_LIMIT = "50000"

[[durable_objects.bindings]]
name = "REVIEWS"
class_name = "Reviews"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Reviews"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]
