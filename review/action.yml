name: Private Investigator
description: >-
  Reviews a pull request with a model inside a NEAR AI Cloud enclave, end-to-end
  encrypted, and posts the review with proof of where the code was read.
inputs:
  nearai-api-key:
    description: NEAR AI Cloud API key.
    required: true
  github-token:
    description: Token that reads the pull request and posts the review.
    default: ${{ github.token }}
  pr:
    description: Pull request number.
    default: ${{ github.event.pull_request.number || github.event.issue.number }}
  rubric:
    description: Comma-separated review instruction files, read from the base commit. Missing files are skipped.
    default: REVIEW.md,AGENTS.md
  model:
    description: >-
      A NEAR AI Cloud model that runs in an enclave on NEAR's own fleet. The review
      stops before sending any code unless the model passes the checks; `npm run
      models` in MultiAgency/private-ai lists the ones that pass today.
    default: z-ai/glm-5.3-flash
  passes:
    description: >-
      How many independent reviews to run in parallel, merged one finding per line.
      Measured in eval/, 3 turned a finding caught by luck into one caught every
      run, in the same time, at about three times the NEAR AI cost (cents).
    default: "3"
  allow-unpatched-model:
    description: >-
      "true" accepts a model whose Intel platform update is pending, a weaker
      guarantee that every review and receipt states. Never a revoked one.
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - shell: bash
      run: npm ci --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH/.."

    - shell: bash
      env:
        NEARAI_API_KEY: ${{ inputs.nearai-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr }}
        RUBRIC: ${{ inputs.rubric }}
        MODEL: ${{ inputs.model }}
        ALLOW_UNPATCHED_MODEL: ${{ inputs.allow-unpatched-model }}
        PASSES: ${{ inputs.passes }}
      run: node "$GITHUB_ACTION_PATH/review.mjs" --receipt "$RUNNER_TEMP/private-review-receipt.json"

    - if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ runner.temp }}/private-review-receipt.json
        # The receipt downloads as the .json file itself, ready for the page's
        # checker, not as a zip. Unarchived, the artifact takes the file's name.
        archive: false
        if-no-files-found: ignore
