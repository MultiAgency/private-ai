[package]
name = "private-investigator"
version = "0.1.1"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
asn1_der = { version = "0.7", default-features = false, features = ["native_types"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
dcap-qvl = { version = "0.6.5", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
ed25519-dalek = { version = "2", default-features = false }
fancy-regex = "0.19"
flate2 = "1"
getrandom = "0.3"
hex = "0.4"
hkdf = "0.12"
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
pem = { version = "3", default-features = false }
rand_core = "0.6"
rsa = { version = "0.9", features = ["sha2"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
outlayer = { version = "0.2", optional = true }
wasip2 = "2"

[features]
# OutLayer's sealed storage (host imports). Local dry runs under plain wasmtime
# build without it: --no-default-features.
default = ["outlayer"]
